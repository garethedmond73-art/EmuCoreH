name: Build Gaz Retro Arcade APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch emulator dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Read every dependency path from the emulator's nested manifest.
          while IFS=' ' read -r key module_path; do
            module="${key%.path}"
            url="$(git config -f core/.gitmodules --get "${module}.url")"
            path="core/${module_path}"
            echo "Preparing dependency: $path"

            # Asio is vendored in this repository at the version expected by
            # this Flycast source. Replacing it with the fork's moving HEAD
            # introduces incompatible APIs and breaks the Android C++ build.
            if [[ "$module_path" == "core/deps/asio" ]] && [[ -f "$path/asio/include/asio.hpp" ]]; then
              echo "Using repository-pinned Asio; skipping floating-HEAD clone."
              continue
            fi

            mkdir -p "$(dirname "$path")"
            rm -rf "$path"
            git clone --depth 1 --recurse-submodules "$url" "$path"
          done < <(git config -f core/.gitmodules --list | grep -F '.path=' | sed 's/=/ /')

          test -f core/core/deps/asio/asio/include/asio.hpp || {
            echo "::error::Compatible vendored Asio headers are missing"
            exit 1
          }
          test -f core/core/deps/glslang/CMakeLists.txt || {
            echo "::error::glslang dependency missing"
            exit 1
          }
          test -f core/core/deps/libchdr/deps/zstd-1.5.6/build/cmake/CMakeLists.txt || {
            echo "::error::libchdr zstd dependency missing"
            exit 1
          }
          echo "All required emulator dependencies are present."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;29.0.14206865"
          sdkmanager "cmake;3.30.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaz-Retro-Arcade-APK
          path: app/build/outputs/apk/debug/*.apk
