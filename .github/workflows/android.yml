name: Build Gaz Retro Arcade APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch emulator dependencies
        shell: bash
        run: |
          set -euo pipefail

          # core/.gitmodules belongs to the emulator's core tree. Its paths
          # are relative to the repository root (core/deps/...), but this
          # repository does not record those dependencies as Git gitlinks.
          # Clone each declared dependency explicitly instead of relying on
          # "git submodule update" at the repository root.
          while read -r key path; do
            module="${key%.path}"
            url="$(git config -f core/.gitmodules --get "${module}.url")"
            echo "Preparing dependency: $path"
            mkdir -p "$(dirname "$path")"

            if [ ! -d "$path/.git" ]; then
              rm -rf "$path"
              git clone --depth 1 --recurse-submodules "$url" "$path"
            else
              git -C "$path" fetch --depth 1 origin
              git -C "$path" submodule sync --recursive
              git -C "$path" submodule update --init --recursive --depth 1
            fi

            # Ensure nested dependencies are initialized even on fresh clones.
            git -C "$path" submodule sync --recursive
            git -C "$path" submodule update --init --recursive --depth 1
          done < <(git config -f core/.gitmodules --get-regexp '^submodule\..*\.path$')

          test -f core/deps/glslang/CMakeLists.txt || {
            echo "::error::glslang dependency was not populated"
            exit 1
          }
          test -f core/deps/libchdr/deps/zstd-1.5.6/build/cmake/CMakeLists.txt || {
            echo "::error::libchdr's pinned zstd dependency was not populated"
            exit 1
          }
          echo "All required emulator dependencies are present."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;29.0.14206865"
          sdkmanager "cmake;3.30.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaz-Retro-Arcade-APK
          path: app/build/outputs/apk/debug/*.apk
