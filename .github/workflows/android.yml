name: Build Gaz Retro Arcade APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Fetch emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The upstream emulator keeps its submodule manifest at core/.gitmodules,
          # rather than the repository root, so actions/checkout cannot discover it.
          while read -r key path; do
            module="${key%.path}"
            url="$(git config -f core/.gitmodules --get "${module}.url")"
            if [ ! -d "$path/.git" ]; then
              echo "Cloning $path from $url"
              mkdir -p "$(dirname "$path")"
              git clone --depth 1 --recurse-submodules "$url" "$path"
            else
              git -C "$path" submodule sync --recursive
            fi

            # Always initialize nested dependencies, including after a fresh clone.
            git -C "$path" submodule sync --recursive
            git -C "$path" submodule update --init --recursive --depth 1
          done < <(git config -f core/.gitmodules --get-regexp '^submodule\..*\.path$')

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;29.0.14206865"
          sdkmanager "cmake;3.30.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaz-Retro-Arcade-APK
          path: app/build/outputs/apk/debug/*.apk
